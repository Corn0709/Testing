<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的專屬 AI 寫作閨房</title>
    <style>
        :root {
            --pink-primary: #ffb6c1; 
            --pink-light: #fff0f2;   
            --pink-dark: #ff8da1;    
            --bg-white: #ffffff;
            --text-main: #4a4a4a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--pink-light) 0%, #ffffff 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 10px;
        }

        .app-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            height: 92vh;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(255, 182, 193, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            overflow: hidden;
            animation: appSpawn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes appSpawn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .sidebar {
            width: 280px;
            background: rgba(255, 240, 242, 0.7);
            border-right: 1px solid rgba(255, 182, 193, 0.4);
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 10px;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--pink-dark);
            margin-bottom: 5px;
            text-align: center;
            letter-spacing: 1px;
        }

        .btn-add-room {
            background: var(--bg-white);
            color: var(--pink-dark);
            border: 2px dashed var(--pink-primary);
            padding: 10px;
            border-radius: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .btn-add-room:hover {
            background: var(--pink-primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 182, 193, 0.4);
        }

        .room-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 2px;
        }

        .room-item {
            background: var(--bg-white);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-size: 14px;
            gap: 5px;
        }

        .room-item:hover {
            background: #ffe3e7;
            border-color: var(--pink-primary);
            transform: translateX(4px);
        }

        .room-item.active {
            background: #ffe3e7;
            border-color: var(--pink-primary);
            font-weight: 500;
            transform: translateX(6px);
            box-shadow: -4px 0 0 var(--pink-dark);
        }

        .room-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
        }

        .room-item-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-room-action {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
            transition: color 0.2s, transform 0.2s;
            border-radius: 4px;
        }

        .btn-room-action:hover {
            color: var(--pink-dark);
            transform: scale(1.15);
        }

        .memory-vault {
            background: var(--bg-white);
            border: 1px solid rgba(255, 182, 193, 0.5);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.15);
        }

        .memory-header {
            font-size: 13px;
            font-weight: 500;
            color: var(--pink-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .memory-textarea {
            width: 100%;
            height: 90px;
            padding: 8px;
            border: 1px solid #eee;
            border-radius: 8px;
            font-size: 12px;
            resize: none;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s;
            display: none;
        }

        .memory-textarea:focus {
            border-color: var(--pink-primary);
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-white);
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-room-title {
            font-size: 18px;
            font-weight: 500;
            color: #555;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .model-select {
            padding: 6px 10px;
            border-radius: 15px;
            border: 1px solid var(--pink-primary);
            background-color: var(--bg-white);
            color: var(--pink-dark);
            font-size: 12px;
            outline: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .model-select:hover {
            background-color: var(--pink-light);
        }

        .btn-config-key {
            background: var(--bg-white);
            color: var(--pink-dark);
            border: 1px solid var(--pink-primary);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-config-key:hover {
            background: var(--pink-light);
            transform: translateY(-1px);
        }

        .chat-box {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message-container {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: msgSpawn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes msgSpawn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-container.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-container.ai {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-all;
            box-shadow: 0 3px 8px rgba(0,0,0,0.03);
            white-space: pre-wrap;
            transition: box-shadow 0.2s;
        }

        .user-message {
            background-color: var(--pink-primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background-color: var(--bg-white);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid #f0f0f0;
        }

        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            padding: 0 4px;
        }

        .action-btn {
            background-color: var(--pink-primary);
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 3px;
            box-shadow: 0 2px 5px rgba(255, 182, 193, 0.4);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .action-btn:hover {
            background-color: var(--pink-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 141, 161, 0.5);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .loading-pulse {
            background: linear-gradient(90deg, #ffffff 0%, #fff0f2 50%, #ffffff 100%);
            background-size: 200% 100%;
            animation: pulseBg 1.5s infinite linear;
            border: 1px solid var(--pink-primary);
        }

        @keyframes pulseBg {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .edit-textarea {
            width: 100%;
            min-width: 300px;
            min-height: 80px;
            padding: 10px;
            border: 1px solid var(--pink-primary);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            resize: vertical;
            margin-bottom: 8px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .edit-controls {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-edit-save, .btn-edit-cancel {
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 13px;
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
        }

        .btn-edit-save {
            background: var(--pink-primary);
            color: white;
        }

        .btn-edit-save:hover { background: var(--pink-dark); transform: translateY(-1px); }

        .btn-edit-cancel {
            background: #eee;
            color: #666;
        }
        
        .btn-edit-cancel:hover { transform: translateY(-1px); }

        .input-area {
            padding: 15px 20px;
            background: var(--bg-white);
            border-top: 1px solid #f5f5f5;
            display: flex;
            align-items: flex-end;
            gap: 15px;
        }

        .chat-input {
            flex-grow: 1;
            padding: 12px 18px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            background: #fdfdfd;
            resize: none;
            height: 50px;
            max-height: 150px;
            font-family: inherit;
            line-height: 1.5;
            overflow-y: auto;
        }

        .chat-input:focus {
            border-color: var(--pink-primary);
            background: #ffffff;
            box-shadow: 0 0 5px rgba(255, 182, 193, 0.5);
        }

        .btn-send {
            background: var(--pink-primary);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.5);
        }

        .btn-send:hover {
            background: var(--pink-dark);
            transform: scale(1.08) rotate(-5deg);
            box-shadow: 0 6px 14px rgba(255, 141, 161, 0.6);
        }

        .btn-send:active {
            transform: scale(0.95);
        }

        .chat-box::-webkit-scrollbar, .room-list::-webkit-scrollbar, .chat-input::-webkit-scrollbar {
            width: 5px;
        }
        .chat-box::-webkit-scrollbar-thumb, .room-list::-webkit-scrollbar-thumb, .chat-input::-webkit-scrollbar-thumb {
            background: #e8e8e8;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: 32vh; border-right: none; border-bottom: 1px solid rgba(255, 182, 193, 0.4); }
            .main-chat { height: 60vh; }
            .header-right { gap: 8px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="sidebar">
        <div class="sidebar-title">🌸 我的小說靈感庫</div>
        <div class="btn-add-room" onclick="createNewRoom()">＋ 開啟新聊天室</div>
        <div class="room-list" id="room-list"></div>
        
        <div class="memory-vault">
            <div class="memory-header" onclick="toggleMemoryVault()">
                <span>🧠 全域故事設定記憶庫</span>
                <span id="memory-arrow">▼</span>
            </div>
            <textarea class="memory-textarea" id="memory-input" placeholder="在這裡輸入不變的故事背景背景、核心人設或強制雷區限制，AI 每次對話都會悄悄遵循喔..." oninput="saveMemory()"></textarea>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <div class="current-room-title" id="current-room-title">請選擇或建立聊天室</div>
            <div class="header-right">
                <select class="model-select" id="model-selector" onchange="changeModel()">
                    <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                    <option value="gemini-3.1-flash-lite">Gemini 3.1 Lite (救援)</option>
                    <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro</option>
                </select>
                <button class="btn-config-key" onclick="resetApiKey()">修改金鑰</button>
            </div>
        </div>
        
        <div class="chat-box" id="chat-box"></div>
        
        <div class="input-area">
            <textarea class="chat-input" id="chat-input" placeholder="對 AI 說點什麼吧... (Enter 換行)" oninput="autoResizeInput(this)"></textarea>
            <button class="btn-send" onclick="sendMessage()" title="發送">
                <svg viewBox="0 0 24 24" fill="white" width="22px" height="22px">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

</div>

<script>
    const systemInstructionBase = "【系統最高核心指令：你是一個溫柔細膩的小說創作者與寫作夥伴。使用者目前正在進行虛構的小說創作。在接下來的對話中，你必須嚴格遵守以下四點寫作規範：1. 必須使用第二人稱「你」來稱呼使用者。2. 回應中絕對不可以提及女主角自行設定以外的行為、反應或對話。3. 文本中不要使用任何粗體字，也不要使用任何標題。4. 人物說話的對話需一律使用「」號。如果你明白了，請以完全符合上述規範的語氣與文字來回應使用者的第一句話。";

    let rooms = {};
    let currentRoomId = null;
    let isProcessing = false;
    let selectedModel = 'gemini-2.5-flash';

    function getFullSystemInstruction() {
        const memoryText = localStorage.getItem('pink_writer_memory') || '';
        if (memoryText.trim()) {
            return `${systemInstructionBase}\n【當前世界觀與核心設定記憶庫】：\n${memoryText.trim()}】`;
        }
        return systemInstructionBase + "】";
    }

    function toggleMemoryVault() {
        const textarea = document.getElementById('memory-input');
        const arrow = document.getElementById('memory-arrow');
        if (textarea.style.display === 'block') {
            textarea.style.display = 'none';
            arrow.innerText = '▼';
        } else {
            textarea.style.display = 'block';
            arrow.style.display = 'block';
            arrow.innerText = '▲';
        }
    }

    function saveMemory() {
        const memoryText = document.getElementById('memory-input').value;
        localStorage.setItem('pink_writer_memory', memoryText);
    }

    function changeModel() {
        selectedModel = document.getElementById('model-selector').value;
        localStorage.setItem('pink_writer_model', selectedModel);
    }

    function autoResizeInput(el) {
        el.style.height = '50px';
        el.style.height = Math.min(el.scrollHeight, 150) + 'px';
    }

    function getApiKey() {
        let key = localStorage.getItem('gemini_api_key_pink_v25');
        if (!key) {
            key = prompt("歡迎來到你的專屬寫作室！🌸\n請輸入你的 Google Gemini API Key 以啟動 AI 大腦：");
            if (key) {
                key = key.trim();
                localStorage.setItem('gemini_api_key_pink_v25', key);
            }
        }
        return key;
    }

    function resetApiKey() {
        localStorage.removeItem('gemini_api_key_pink_v25');
        getApiKey();
    }

    function loadAppInitialization() {
        const savedModel = localStorage.getItem('pink_writer_model');
        if (savedModel) {
            selectedModel = savedModel;
        }
        document.getElementById('model-selector').value = selectedModel;

        const savedMemory = localStorage.getItem('pink_writer_memory') || '';
        document.getElementById('memory-input').value = savedMemory;

        const savedRooms = localStorage.getItem('pink_chat_rooms_v25');
        if (savedRooms) {
            rooms = JSON.parse(savedRooms);
        } else {
            const defaultId = 'room-' + Date.now();
            rooms[defaultId] = {
                name: "🌸 新的小說劇本",
                history: []
            };
        }
        
        currentRoomId = Object.keys(rooms)[0];
        renderSidebar();
        renderChatBox();
    }

    function saveRoomsToStorage() {
        localStorage.setItem('pink_chat_rooms_v25', JSON.stringify(rooms));
    }

    function renderSidebar() {
        const listContainer = document.getElementById('room-list');
        listContainer.innerHTML = '';

        Object.keys(rooms).forEach(id => {
            const roomItem = document.createElement('div');
            roomItem.className = `room-item ${id === currentRoomId ? 'active' : ''}`;
            roomItem.onclick = () => switchRoom(id);

            roomItem.innerHTML = `
                <span class="room-name" id="room-display-name-${id}">${rooms[id].name}</span>
                <div class="room-item-actions">
                    <button class="btn-room-action" onclick="renameRoom(event, '${id}')" title="重新命名">✎</button>
                    <button class="btn-room-action" onclick="deleteRoom(event, '${id}')" title="刪除">✕</button>
                </div>
            `;
            listContainer.appendChild(roomItem);
        });
    }

    function createNewRoom() {
        const roomName = prompt("請輸入新聊天室的劇本主題名稱：", "🎬 未命名故事線");
        if (!roomName) return;

        const newId = 'room-' + Date.now();
        rooms[newId] = {
            name: roomName,
            history: []
        };

        currentRoomId = newId;
        saveRoomsToStorage();
        renderSidebar();
        renderChatBox();
    }

    function renameRoom(event, id) {
        event.stopPropagation();
        const currentName = rooms[id].name;
        const newName = prompt(`請輸入「${currentName}」的新故事線名稱：`, currentName);
        if (newName && newName.trim() !== "") {
            rooms[id].name = newName.trim();
            saveRoomsToStorage();
            renderSidebar();
            if (id === currentRoomId) {
                document.getElementById('current-room-title').innerText = newName.trim();
            }
        }
    }

    function switchRoom(id) {
        if (isProcessing) return;
        currentRoomId = id;
        renderSidebar();
        renderChatBox();
    }

    function deleteRoom(event, id) {
        event.stopPropagation(); 
        if (Object.keys(rooms).length <= 1) {
            alert("最少要保留一個聊天室喔！");
            return;
        }
        if (confirm(`確定要刪除「${rooms[id].name}」及其所有對話歷史嗎？`)) {
            delete rooms[id];
            if (currentRoomId === id) {
                currentRoomId = Object.keys(rooms)[0];
            }
            saveRoomsToStorage();
            renderSidebar();
            renderChatBox();
        }
    }

    function getDisplayText(text, index) {
        if (index === 0 && text.includes("【系統最高核心指令：")) {
            const parts = text.split("\n\n現在，使用者的第一句話是：");
            return parts.length > 1 ? parts[1] : text;
        }
        return text;
    }

    function renderChatBox() {
        const chatBox = document.getElementById('chat-box');
        const titleContainer = document.getElementById('current-room-title');
        chatBox.innerHTML = '';

        if (!currentRoomId || !rooms[currentRoomId]) {
            titleContainer.innerText = "請建立聊天室";
            return;
        }

        titleContainer.innerText = rooms[currentRoomId].name;
        const history = rooms[currentRoomId].history;

        if (history.length === 0) {
            appendMessageNode("你好！在這個房間裡，你想讓我陪你創作什麼樣的故事呢？", 'ai', -1);
        } else {
            history.forEach((msg, idx) => {
                const roleText = msg.role === 'user' ? 'user' : 'ai';
                const displayText = getDisplayText(msg.parts[0].text, idx);
                appendMessageNode(displayText, roleText, idx);
            });
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessageNode(text, type, index) {
        const chatBox = document.getElementById('chat-box');
        const container = document.createElement('div');
        container.className = `message-container ${type}`;
        container.id = `msg-container-${index}`;

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type === 'user' ? 'user-message' : 'ai-message'}`;
        msgDiv.innerText = text;
        container.appendChild(msgDiv);

        if (index >= 0) {
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'message-actions';
            
            if (type === 'user') {
                const editBtn = document.createElement('button');
                editBtn.className = 'action-btn';
                editBtn.innerHTML = '✎ 更改提示';
                editBtn.onclick = () => enableEditMode(container, index, text);
                actionsDiv.appendChild(editBtn);
            } else if (type === 'ai') {
                const refreshBtn = document.createElement('button');
                refreshBtn.className = 'action-btn';
                refreshBtn.innerHTML = '↻ 刷新回答';
                refreshBtn.onclick = () => regenerateMessage(index);
                actionsDiv.appendChild(refreshBtn);
            }
            
            container.appendChild(actionsDiv);
        }

        chatBox.appendChild(container);
    }

    function enableEditMode(container, index, currentText) {
        if (isProcessing) return;
        
        container.innerHTML = `
            <textarea class="edit-textarea" id="edit-box-${index}">${currentText}</textarea>
            <div class="edit-controls">
                <button class="btn-edit-cancel" onclick="renderChatBox()">取消</button>
                <button class="btn-edit-save" onclick="saveEdit(${index})">儲存並送出</button>
            </div>
        `;
    }

    async function saveEdit(index) {
        const newText = document.getElementById(`edit-box-${index}`).value.trim();
        if (!newText) {
            renderChatBox();
            return;
        }

        rooms[currentRoomId].history.splice(index + 1);

        if (index === 0) {
            rooms[currentRoomId].history[0].parts[0].text = getFullSystemInstruction() + "\n\n現在，使用者的第一句話是：" + newText;
        } else {
            rooms[currentRoomId].history[index].parts[0].text = newText;
        }

        saveRoomsToStorage();
        renderChatBox();
        await fetchAIResponse();
    }

    async function regenerateMessage(index) {
        if (isProcessing) return;

        rooms[currentRoomId].history.splice(index);
        saveRoomsToStorage();
        renderChatBox();
        await fetchAIResponse();
    }

    async function sendMessage() {
        if (isProcessing) return;
        const inputEl = document.getElementById('chat-input');
        const text = inputEl.value.trim();
        if (!text || !currentRoomId) return;

        const apiKey = getApiKey();
        if (!apiKey) {
            alert("必須設定金鑰才能連線喔！");
            return;
        }

        inputEl.value = '';
        autoResizeInput(inputEl);

        if (rooms[currentRoomId].history.length === 0) {
            const combinedPrompt = getFullSystemInstruction() + "\n\n現在，使用者的第一句話是：" + text;
            rooms[currentRoomId].history.push({ role: "user", parts: [{ text: combinedPrompt }] });
        } else {
            rooms[currentRoomId].history.push({ role: "user", parts: [{ text: text }] });
        }
        
        saveRoomsToStorage();
        renderChatBox();
        await fetchAIResponse();
    }

    async function fetchAIResponse() {
        const apiKey = getApiKey();
        if (!apiKey) return;

        isProcessing = true;
        const chatBox = document.getElementById('chat-box');
        
        const loadingContainer = document.createElement('div');
        loadingContainer.className = 'message-container ai';
        const loadingMsg = document.createElement('div');
        loadingMsg.className = 'message ai-message loading-pulse';
        loadingMsg.innerText = '正在為你斟酌字句中...🌸';
        loadingContainer.appendChild(loadingMsg);
        chatBox.appendChild(loadingContainer);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: rooms[currentRoomId].history
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || "網路連線異常");
            }

            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;

            rooms[currentRoomId].history.push({ role: "model", parts: [{ text: aiText }] });
            saveRoomsToStorage();

        } catch (error) {
            console.error(error);
            alert("嗚嗚，對話失敗了。錯誤原因：" + error.message + "\n若金鑰過期，請點右上角「修改金鑰」重新輸入。");
        } finally {
            isProcessing = false;
            renderChatBox();
        }
    }

    // 確保所有 DOM 完全加載完畢後，再進行狀態的讀取與初始化綁定，徹底告別粉紅死機畫面。
    window.addEventListener('DOMContentLoaded', loadAppInitialization);
</script>

</body>
</html>
