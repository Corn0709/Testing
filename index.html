<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Phone Simulator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 手機外框 */
    .phone-container {
      width: 375px;
      height: 750px;
      background-color: #000;
      border-radius: 40px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 0 4px #333;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 頂部瀏海/狀態列 */
    .status-bar {
      height: 40px;
      background: rgba(0,0,0,0.2);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 14px;
      z-index: 100;
      position: absolute;
      top: 0;
      width: 100%;
    }

    /* 手機桌面 */
    .home-screen {
      flex: 1;
      background-size: cover;
      background-position: center;
      padding: 60px 20px 20px 20px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 80px;
      gap: 15px;
      align-content: start;
    }

    /* App 圖示 */
    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .app-icon .icon {
      width: 55px;
      height: 55px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .app-icon span {
      color: #fff;
      font-size: 11px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .bg-twitter { background-color: #1da1f2; }
    .bg-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .bg-settings { background-color: #8e8e93; }

    /* 全螢幕 App 容器 */
    .app-window {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      z-index: 50;
      display: none;
      flex-direction: column;
      padding-top: 40px;
    }

    .app-header {
      height: 44px;
      border-bottom: 1px solid #dbdbdb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      font-weight: bold;
      background: #fafafa;
    }

    .back-btn {
      color: #007aff;
      cursor: pointer;
      font-size: 14px;
      background: none;
      border: none;
    }

    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    /* 密碼鎖屏 */
    .lock-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 200;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .lock-screen input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      text-align: center;
      font-size: 18px;
      margin-top: 15px;
      width: 150px;
    }

    .lock-screen button {
      margin-top: 10px;
      padding: 8px 20px;
      border-radius: 8px;
      border: none;
      background: #007aff;
      color: #fff;
      cursor: pointer;
    }

    /* 設定 App 內部樣式 */
    .settings-item {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .settings-item input[type="text"] {
      width: 60%;
      padding: 5px;
    }

    /* IG 聊天室樣式 */
    .chat-msg {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
    }

    .chat-msg.me { align-items: flex-end; }
    .chat-msg.other { align-items: flex-start; }

    .bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
    }

    .me .bubble { background: #3797f0; color: #fff; }
    .other .bubble { background: #efefef; color: #000; }

    .chat-input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #dbdbdb;
    }

    .chat-input-area input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #dbdbdb;
      border-radius: 20px;
      outline: none;
    }

    .chat-input-area button {
      margin-left: 8px;
      background: none;
      border: none;
      color: #3797f0;
      font-weight: bold;
      cursor: pointer;
    }

    /* 推特樣式 */
    .tweet {
      border-bottom: 1px solid #e1e8ed;
      padding: 12px 0;
    }

    .tweet-header {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .tweet-body {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .tweet-img {
      width: 100%;
      border-radius: 12px;
      margin-top: 5px;
    }

    .tweet-composer {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 2px solid #eee;
    }

    .tweet-composer textarea {
      width: 100%;
      height: 60px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: none;
    }

    .tweet-composer button {
      align-self: flex-end;
      background: #1da1f2;
      color: #fff;
      border: none;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <!-- 鎖屏頁面 -->
    <div id="lockScreen" class="lock-screen">
      <h2>請輸入密碼</h2>
      <input type="password" id="passcodeInput" placeholder="預設密碼: 1234">
      <button onclick="unlockPhone()">解鎖</button>
    </div>

    <!-- 狀態列 -->
    <div class="status-bar">
      <span id="currentTime">00:00</span>
      <span>100% 🔋</span>
    </div>

    <!-- 桌面 -->
    <div id="homeScreen" class="home-screen" style="background-image: url('https://picsum.photos/375/750');">
      <div class="app-icon" onclick="openApp('twitterApp')">
        <div class="icon bg-twitter">X</div>
        <span>推特</span>
      </div>
      <div class="app-icon" onclick="openApp('instagramApp')">
        <div class="icon bg-instagram">IG</div>
        <span>聊天</span>
      </div>
      <div class="app-icon" onclick="openApp('settingsApp')">
        <div class="icon bg-settings">⚙️</div>
        <span>設定</span>
      </div>
    </div>

    <!-- 設定 App -->
    <div id="settingsApp" class="app-window">
      <div class="app-header">
        <button class="back-btn" onclick="closeApp('settingsApp')">‹ 返回</button>
        <span>設定</span>
        <span></span>
      </div>
      <div class="app-content">
        <div class="settings-item">
          <span>解鎖密碼</span>
          <input type="text" id="settingPasscode" value="1234">
        </div>
        <div class="settings-item">
          <span>桌布圖片網址</span>
          <input type="text" id="settingBgUrl" value="https://picsum.photos/375/750">
        </div>
        <button style="margin-top:15px; width:100%; padding:8px; background:#007aff; color:#fff; border:none; border-radius:8px;" onclick="saveSettings()">儲存設定</button>
        
        <!-- 裝飾性靜態設定 -->
        <div style="margin-top: 30px; opacity: 0.5;">
          <div class="settings-item"><span>Wi-Fi</span><span>已連線 ›</span></div>
          <div class="settings-item"><span>藍牙</span><span>開啟 ›</span></div>
          <div class="settings-item"><span>通知</span><span>›</span></div>
          <div class="settings-item"><span>聲音與觸覺回饋</span><span>›</span></div>
          <div class="settings-item"><span>一般</span><span>›</span></div>
        </div>
      </div>
    </div>

    <!-- 聊天室 (Instagram DM 風格) -->
    <div id="instagramApp" class="app-window">
      <div class="app-header">
        <button class="back-btn" onclick="closeApp('instagramApp')">‹ 返回</button>
        <span>AI 角色</span>
        <span></span>
      </div>
      <div class="app-content" id="chatContent">
        <div class="chat-msg other">
          <div class="bubble">你好！今天過得怎麼樣？</div>
        </div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="傳送訊息...">
        <button onclick="sendChatMessage()">傳送</button>
      </div>
    </div>

    <!-- 推特 App -->
    <div id="twitterApp" class="app-window">
      <div class="app-header">
        <button class="back-btn" onclick="closeApp('twitterApp')">‹ 返回</button>
        <span>動態牆</span>
        <span></span>
      </div>
      <div class="app-content">
        <div class="tweet-composer">
          <textarea id="tweetInput" placeholder="有什麼新鮮事？(不公開)"></textarea>
          <button onclick="postTweet()">發布</button>
        </div>
        <div id="tweetFeed">
          <!-- 動態貼文將渲染於此 -->
        </div>
      </div>
    </div>

  </div>

  <script>
    // 系統變數
    let currentPasscode = localStorage.getItem('phone_passcode') || '1234';
    let currentBg = localStorage.getItem('phone_bg') || 'https://picsum.photos/375/750';
    let lastAiPostDate = localStorage.getItem('last_ai_post_date') || '';

    // 初始化頁面設定
    document.getElementById('homeScreen').style.backgroundImage = `url('${currentBg}')`;
    document.getElementById('settingPasscode').value = currentPasscode;
    document.getElementById('settingBgUrl').value = currentBg;

    // 時間更新
    function updateTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('currentTime').innerText = `${hours}:${minutes}`;
    }
    setInterval(updateTime, 1000);
    updateTime();

    // 解鎖手機
    function unlockPhone() {
      const input = document.getElementById('passcodeInput').value;
      if (input === currentPasscode) {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('passcodeInput').value = '';
        checkAiDailyTweet(); // 解鎖後檢查 AI 今日是否已發文
      } else {
        alert('密碼錯誤！');
      }
    }

    // 切換 App 開啟/關閉
    function openApp(id) {
      document.getElementById(id).style.display = 'flex';
    }

    function closeApp(id) {
      document.getElementById(id).style.display = 'none';
    }

    // 設定功能
    function saveSettings() {
      currentPasscode = document.getElementById('settingPasscode').value;
      currentBg = document.getElementById('settingBgUrl').value;
      
      localStorage.setItem('phone_passcode', currentPasscode);
      localStorage.setItem('phone_bg', currentBg);
      
      document.getElementById('homeScreen').style.backgroundImage = `url('${currentBg}')`;
      alert('設定已儲存！');
    }

    // IG 聊天室功能
    function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const chatContent = document.getElementById('chatContent');
      
      // 使用者訊息
      const userMsg = document.createElement('div');
      userMsg.className = 'chat-msg me';
      userMsg.innerHTML = `<div class="bubble">${text}</div>`;
      chatContent.appendChild(userMsg);
      input.value = '';

      // 模擬 AI 自動回覆 (角色隔離，僅回應你)
      setTimeout(() => {
        const aiMsg = document.createElement('div');
        aiMsg.className = 'chat-msg other';
        aiMsg.innerHTML = `<div class="bubble">這是一條模擬回覆：收到你的訊息「${text}」了！</div>`;
        chatContent.appendChild(aiMsg);
        chatContent.scrollTop = chatContent.scrollHeight;
      }, 1000);

      chatContent.scrollTop = chatContent.scrollHeight;
    }

    // 推特功能
    function postTweet() {
      const input = document.getElementById('tweetInput');
      const text = input.value.trim();
      if (!text) return;

      addTweetToFeed('你 (不公開)', text);
      input.value = '';
    }

    function addTweetToFeed(author, content, imgUrl = null) {
      const feed = document.getElementById('tweetFeed');
      const tweet = document.createElement('div');
      tweet.className = 'tweet';
      
      let imgHtml = imgUrl ? `<img src="${imgUrl}" class="tweet-img">` : '';
      tweet.innerHTML = `
        <div class="tweet-header">${author}</div>
        <div class="tweet-body">${content}</div>
        ${imgHtml}
      `;
      feed.prepend(tweet);
    }

    // 檢查並觸發 AI 角色每日發文 (一天限一篇，使用 Picsum 免費圖片)
    function checkAiDailyTweet() {
      const today = new Date().toDateString();
      if (lastAiPostDate !== today) {
        // 發布今日 AI 動態
        const randomImgId = Math.floor(Math.random() * 1000);
        const imageUrl = `https://picsum.photos/id/${randomImgId}/300/200`;
        
        addTweetToFeed('AI 虛擬角色', '這是今天的日常分享！今天的天氣真不錯。', imageUrl);
        
        // 紀錄發文日期
        localStorage.setItem('last_ai_post_date', today);
        lastAiPostDate = today;
      }
    }
  </script>
</body>
</html>
