
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>我的專屬 AI 寫作閨房</title>
    <style>
        :root {
            --pink-primary: #ffb6c1; 
            --pink-light: #fff0f2;   
            --pink-dark: #ff8da1;    
            --pink-soft: #ffe4e8;
            --bg-white: #ffffff;
            --text-main: #4a4a4a;
            --sidebar-width: 310px;
            --transition-smooth: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            --shadow-sm: 0 4px 12px rgba(255, 182, 193, 0.15);
            --shadow-md: 0 8px 24px rgba(255, 182, 193, 0.25);
            --shadow-lg: 0 12px 40px rgba(255, 182, 193, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: linear-gradient(135deg, var(--pink-light) 0%, #ffffff 50%, #fbf3f5 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 15px;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            width: 100%;
            max-width: 1150px;
            height: 94vh;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.8);
            overflow: hidden;
            position: relative;
            animation: appSpawn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes appSpawn {
            from { opacity: 0; transform: scale(0.96) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* 側邊欄 */
        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, rgba(255, 240, 242, 0.9) 0%, rgba(255, 255, 255, 0.7) 100%);
            border-right: 1px solid rgba(255, 182, 193, 0.25);
            display: flex;
            flex-direction: column;
            padding: 28px 20px;
            gap: 20px;
            transition: var(--transition-smooth);
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }

        .sidebar.collapsed {
            width: 0;
            padding: 28px 0;
            border-right: none;
        }

        .sidebar-toggle-btn {
            position: absolute;
            left: 15px;
            bottom: 25px;
            width: 44px;
            height: 44px;
            background: var(--bg-white);
            border: 1px solid rgba(255, 182, 193, 0.5);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow-sm);
            z-index: 10;
            transition: var(--transition-smooth);
            font-size: 14px;
            color: var(--pink-dark);
        }

        .sidebar-toggle-btn:hover {
            transform: scale(1.12) rotate(-8deg);
            background: var(--pink-light);
            border-color: var(--pink-dark);
            box-shadow: var(--shadow-md);
        }

        .sidebar-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--pink-dark);
            text-align: center;
            letter-spacing: 1.5px;
            white-space: nowrap;
            text-shadow: 0 2px 4px rgba(255, 182, 193, 0.2);
        }

        .btn-add-room {
            background: var(--bg-white);
            color: var(--pink-dark);
            border: 2px dashed var(--pink-primary);
            padding: 14px;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-align: center;
            white-space: nowrap;
            font-size: 15px;
        }

        .btn-add-room:hover {
            background: var(--pink-primary);
            color: white;
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: transparent;
        }

        .room-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .room-item {
            background: var(--bg-white);
            padding: 14px 18px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
            transition: var(--transition-smooth);
            font-size: 15px;
            gap: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.01);
        }

        .room-item:hover {
            background: #ffe6e9;
            transform: translateX(4px);
        }

        .room-item.active {
            background: #ffe6e9;
            border-color: var(--pink-primary);
            font-weight: 600;
            transform: translateX(6px);
            box-shadow: -6px 0 0 var(--pink-dark), var(--shadow-sm);
        }

        .room-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
        }

        .room-item-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-room-action {
            background: none;
            border: none;
            color: #d0c0c2;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            transition: color 0.2s, transform 0.2s;
        }

        .btn-room-action:hover {
            color: var(--pink-dark);
            transform: scale(1.25);
        }

        .memory-vault {
            background: var(--bg-white);
            border: 1px solid rgba(255, 182, 193, 0.4);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-smooth);
        }

        .memory-vault:focus-within {
            box-shadow: var(--shadow-md);
            border-color: var(--pink-dark);
        }

        .memory-header {
            font-size: 14px;
            font-weight: 600;
            color: var(--pink-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            white-space: nowrap;
        }

        .memory-textarea {
            width: 100%;
            height: 110px;
            padding: 12px;
            border: 1px solid #f2f2f2;
            border-radius: 12px;
            font-size: 13px;
            resize: none;
            outline: none;
            font-family: inherit;
            transition: border-color 0.3s;
            display: none;
            line-height: 1.5;
            background: #fdfafb;
        }

        .memory-textarea:focus {
            border-color: var(--pink-primary);
            background: #fff;
        }

        /* 主對話主體 */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-white);
            position: relative;
            height: 100%;
            overflow: hidden;
        }

        .floating-toggle {
            position: absolute;
            left: 15px;
            bottom: 25px;
            width: 48px;
            height: 48px;
            background: var(--bg-white);
            border: 1px solid var(--pink-primary);
            border-radius: 50%;
            cursor: pointer;
            display: none;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow-md);
            z-index: 99;
            animation: bounceIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: var(--pink-dark);
            font-size: 15px;
        }

        .sidebar.collapsed + .main-chat .floating-toggle {
            display: flex;
        }

        @keyframes bounceIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        /* 頂部控制欄 */
        .chat-header {
            padding: 18px 28px;
            border-bottom: 1px solid rgba(255, 182, 193, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            z-index: 5;
            gap: 12px;
            flex-shrink: 0;
        }

        .mobile-menu-trigger {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--pink-dark);
            padding: 6px;
        }

        .current-room-title {
            font-size: 17px;
            font-weight: 600;
            color: #555;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .model-select {
            padding: 8px 14px;
            border-radius: 24px;
            border: 1.5px solid var(--pink-primary);
            background-color: var(--bg-white);
            color: var(--pink-dark);
            font-size: 13px;
            outline: none;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition-smooth);
        }

        .btn-config-key {
            background: var(--bg-white);
            color: var(--pink-dark);
            border: 1.5px solid var(--pink-primary);
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition-smooth);
        }

        .btn-config-key:hover, .model-select:hover {
            background: var(--pink-light);
            border-color: var(--pink-dark);
            transform: translateY(-1px);
        }

        /* 漢堡選單 */
        .burger-menu-container {
            position: relative;
        }

        .burger-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 10px;
            border-radius: 50%;
            transition: var(--transition-smooth);
        }

        .burger-btn:hover { background: var(--pink-light); }

        .burger-btn span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: var(--pink-dark);
            border-radius: 2px;
        }

        .dropdown-menu {
            position: absolute;
            right: 0;
            top: 48px;
            background: var(--bg-white);
            border: 1px solid rgba(255, 182, 193, 0.4);
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            display: none;
            flex-direction: column;
            min-width: 190px;
            overflow: hidden;
            z-index: 100;
            transform-origin: top right;
            animation: menuGrow 0.25s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes menuGrow {
            from { opacity: 0; transform: scale(0.9) translateY(-5px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .dropdown-item {
            padding: 14px 18px;
            font-size: 14px;
            color: var(--text-main);
            background: none;
            border: none;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: 500;
        }

        .dropdown-item:hover {
            background: var(--pink-light);
            color: var(--pink-dark);
        }

        /* 對話歷史區 */
        .chat-box {
            flex-grow: 1;
            padding: 28px;
            overflow-y: auto;
            background-color: #fdfbfb;
            display: flex;
            flex-direction: column;
            gap: 26px;
        }

        .message-container {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: msgSpawn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        @keyframes msgSpawn {
            from { opacity: 0; transform: translateY(22px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-container.user { align-self: flex-end; align-items: flex-end; }
        .message-container.ai { align-self: flex-start; align-items: flex-start; }

        .message {
            padding: 16px 20px;
            border-radius: 22px;
            font-size: 15.5px;
            line-height: 1.65;
            word-break: break-all;
            box-shadow: 0 4px 16px rgba(0,0,0,0.015);
            white-space: pre-wrap;
            transition: var(--transition-smooth);
        }

        .user-message {
            background-color: var(--pink-primary);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.4);
        }

        .ai-message {
            background-color: var(--bg-white);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 182, 193, 0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        /* 系統警示專屬樣式 */
        .system-error-message {
            background-color: #fff5f5;
            color: #d9534f;
            border: 1px dashed #d9534f;
            font-size: 14px;
        }

        .message-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            padding: 0 4px;
            flex-wrap: wrap;
        }

        /* 按鈕加大與微光懸停效果 */
        .action-btn {
            background-color: var(--pink-soft);
            color: var(--pink-dark);
            border: none;
            padding: 6px 15px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 3px 8px rgba(255, 182, 193, 0.2);
            transition: var(--transition-smooth);
        }

        .action-btn:hover {
            background-color: var(--pink-dark);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        /* 版本切換大按鍵 */
        .version-switcher {
            display: flex;
            align-items: center;
            background: #f5ecee;
            padding: 4px 14px;
            border-radius: 16px;
            font-size: 12px;
            color: #7a6a6c;
            gap: 8px;
            font-weight: 600;
        }

        .version-arrow {
            background: none;
            border: none;
            color: var(--pink-dark);
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            padding: 2px 6px;
            transition: var(--transition-smooth);
        }

        .version-arrow:hover:not(:disabled) {
            transform: scale(1.2);
        }

        .version-arrow:disabled {
            color: #ccc;
            cursor: not-allowed;
        }

        .loading-pulse {
            background: linear-gradient(90deg, #ffffff 0%, #fff0f2 50%, #ffffff 100%);
            background-size: 200% 100%;
            animation: pulseBg 1.5s infinite linear;
            border: 1.5px solid var(--pink-primary);
        }

        @keyframes pulseBg {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 編輯區域加大靈動 */
        .edit-textarea {
            width: 100%;
            min-width: 290px;
            min-height: 110px;
            padding: 14px;
            border: 2px solid var(--pink-primary);
            border-radius: 18px;
            font-size: 15.5px;
            font-family: inherit;
            outline: none;
            resize: vertical;
            margin-bottom: 10px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-smooth);
        }

        .edit-textarea:focus {
            border-color: var(--pink-dark);
            box-shadow: var(--shadow-md);
        }

        .edit-controls {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-edit-save, .btn-edit-cancel {
            padding: 8px 18px;
            border-radius: 18px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: var(--transition-smooth);
        }

        .btn-edit-save { 
            background: var(--pink-primary); 
            color: white; 
            box-shadow: var(--shadow-sm);
        }
        .btn-edit-save:hover {
            background: var(--pink-dark);
            transform: translateY(-1.5px);
        }
        .btn-edit-cancel { background: #eee; color: #666; }
        .btn-edit-cancel:hover { background: #e0e0e0; }

        /* 底欄輸入區 */
        .input-area {
            padding: 22px 28px;
            background: var(--bg-white);
            border-top: 1px solid rgba(255, 182, 193, 0.15);
            display: flex;
            align-items: flex-end;
            gap: 14px;
            flex-shrink: 0;
        }

        .chat-input {
            flex-grow: 1;
            padding: 16px 22px;
            border: 1.5px solid #eae1e3;
            border-radius: 26px;
            font-size: 15.5px;
            outline: none;
            transition: var(--transition-smooth);
            background: #fdfcfc;
            resize: none;
            height: 56px;
            max-height: 180px;
            font-family: inherit;
            line-height: 1.55;
            overflow-y: auto;
        }

        .chat-input:focus {
            border-color: var(--pink-primary);
            background: #ffffff;
            box-shadow: 0 0 12px rgba(255, 182, 193, 0.4);
        }

        /* 放大右下發送大按鍵 */
        .btn-send {
            background: var(--pink-primary);
            color: white;
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            flex-shrink: 0;
            box-shadow: 0 6px 16px rgba(255, 182, 193, 0.5);
        }

        .btn-send:hover {
            background: var(--pink-dark);
            transform: scale(1.1) rotate(-6deg);
            box-shadow: 0 8px 22px rgba(255, 182, 193, 0.7);
        }

        /* 自適應行動端 */
        @media (max-width: 768px) {
            body { 
                padding: 0; 
                height: 100dvh; 
            }
            .app-container { 
                height: 100%; 
                border-radius: 0; 
                border: none; 
            }
            
            .sidebar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100% !important;
                height: 60vh; 
                background: rgba(255, 255, 255, 0.98);
                backdrop-filter: blur(25px);
                -webkit-backdrop-filter: blur(25px);
                z-index: 999;
                border-right: none;
                border-top: 1.5px solid rgba(255, 182, 193, 0.4);
                border-radius: 24px 24px 0 0;
                transform: translateY(100%);
                box-shadow: 0 -10px 30px rgba(0,0,0,0.08);
                padding: 22px 18px;
                gap: 15px;
            }
            
            .sidebar.active-mobile {
                transform: translateY(0);
            }

            .sidebar-toggle-btn {
                display: none;
            }

            .sidebar-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.2);
                z-index: 998;
                display: none;
                backdrop-filter: blur(2px);
                -webkit-backdrop-filter: blur(2px);
            }

            .sidebar-overlay.active {
                display: block;
            }

            .mobile-menu-trigger {
                display: block;
            }
            .chat-header {
                padding: 10px 14px;
                height: 52px; 
            }
            .current-room-title {
                font-size: 15px;
            }
            .header-right {
                gap: 8px;
            }
            .model-select, .btn-config-key {
                padding: 5px 10px;
                font-size: 11px;
            }

            .chat-box { 
                padding: 15px; 
                gap: 16px; 
            }
            .message-container { max-width: 92%; }
            .message { font-size: 14.5px; padding: 12px 16px; line-height: 1.55; }
            .message-actions { gap: 8px; margin-top: 6px; }
            .action-btn { padding: 4px 10px; font-size: 11px; }
            .version-switcher { padding: 3px 10px; font-size: 11px; }
            
            .input-area { 
                padding: 10px 16px; 
                gap: 10px; 
                background: #ffffff;
            }
            .chat-input { 
                padding: 10px 16px; 
                font-size: 14.5px; 
                height: 42px; 
                min-height: 42px;
            }
            .btn-send { 
                width: 42px; 
                height: 42px; 
            }
        }
    </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMobileSidebar()"></div>

<div class="app-container">
    
    <!-- 側邊工具欄 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-title">🌸 我的小說靈感庫</div>
        <div class="btn-add-room" onclick="createNewRoom()">＋ 開啟新故事線</div>
        <div class="room-list" id="room-list"></div>
        
        <div class="memory-vault">
            <div class="memory-header" onclick="toggleMemoryVault()">
                <span>🧠 核心故事設定記憶庫</span>
                <span id="memory-arrow">▼</span>
            </div>
            <textarea class="memory-textarea" id="memory-input" placeholder="在這裡設定全域限制，例如：
- 使用第二人稱稱呼我
- 回應不可提及女主自行設定外的行為
- 絕對不要用粗體字與標題
- 對話使用「」" oninput="saveMemory()"></textarea>
        </div>

        <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="收起側欄">◀</button>
    </div>

    <!-- 右側主要對話面板 -->
    <div class="main-chat">
        <button class="floating-toggle" onclick="toggleSidebar()" title="展開側欄">▶</button>

        <div class="chat-header">
            <button class="mobile-menu-trigger" onclick="openMobileSidebar()" title="打開故事列表">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M4 6h16M4 12h16M4 18h7"/>
                </svg>
            </button>

            <div class="current-room-title" id="current-room-title">請選擇故事線</div>
            
            <div class="header-right">
                <select class="model-select" id="model-selector" onchange="changeModel()">
                    <option value="gemini-3.1-flash-lite">Gemini 3.1 Lite (預設)</option>
                    <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                    <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro</option>
                </select>
                
                <button class="btn-config-key" onclick="resetApiKey()">金鑰輸入</button>
                
                <div class="burger-menu-container">
                    <button class="burger-btn" onclick="toggleDropdown(event)" title="更多功能">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <div class="dropdown-menu" id="dropdown-menu">
                        <button class="dropdown-item" onclick="exportCurrentChat()">📥 匯出當前文本 (.txt)</button>
                        <button class="dropdown-item" onclick="downloadAllDataBackup()">📦 備份進度檔案 (.json)</button>
                        <button class="dropdown-item" onclick="triggerRestoreFileInput()">🚀 匯入檔案還原 (.json)</button>
                    </div>
                </div>

                <input type="file" id="restore-file-input" accept=".json" style="display: none;" onchange="handleRestoreFile(this)">
            </div>
        </div>
        
        <div class="chat-box" id="chat-box"></div>
        
        <div class="input-area">
            <textarea class="chat-input" id="chat-input" placeholder="對 AI 傾訴新靈感... (按 Enter 直接換行)" oninput="autoResizeInput(this)"></textarea>
            <button class="btn-send" onclick="sendMessage()" title="發送靈感">
                <svg viewBox="0 0 24 24" fill="white" width="18px" height="18px">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

</div>

<script>
    const systemInstructionBase = "【系統最高核心指令：你是一個溫柔細膩的小說創作者與寫作夥伴。使用者目前正在進行虛構的小說創作。在接下來的對話中，你必須嚴格遵守以下四點寫作規範：1. 必須使用第二人稱「你」來稱呼使用者。2. 回應中絕對不可以提及女主角自行設定以外的行為、反應或對話。3. 文本中不要使用 any 粗體字，也不要使用 any 標題。4. 人物說話的對話需一律使用「」號。如果你明白了，請以完全符合上述規範的語氣與文字來回應。】";

    let rooms = {};
    let currentRoomId = null;
    let isProcessing = false;
    let selectedModel = 'gemini-3.1-flash-lite';

    function openMobileSidebar() {
        document.getElementById('sidebar').classList.add('active-mobile');
        document.getElementById('sidebar-overlay').classList.add('active');
    }

    function closeMobileSidebar() {
        document.getElementById('sidebar').classList.remove('active-mobile');
        document.getElementById('sidebar-overlay').classList.remove('active');
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.querySelector('.sidebar-toggle-btn');
        sidebar.classList.toggle('collapsed');
        if (sidebar.classList.contains('collapsed')) {
            toggleBtn.innerText = '▶';
        } else {
            toggleBtn.innerText = '◀';
        }
    }

    function toggleDropdown(e) {
        e.stopPropagation();
        const menu = document.getElementById('dropdown-menu');
        menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    document.addEventListener('click', () => {
        document.getElementById('dropdown-menu').style.display = 'none';
    });

    function getCombinedSystemInstruction() {
        const memoryText = localStorage.getItem('pink_writer_memory') || '';
        if (memoryText.trim()) {
            return `${systemInstructionBase}\n\n【重要：設定記憶庫】：\n${memoryText.trim()}`;
        }
        return systemInstructionBase;
    }

    function toggleMemoryVault() {
        const textarea = document.getElementById('memory-input');
        const arrow = document.getElementById('memory-arrow');
        const isOpen = textarea.style.display === 'block';
        textarea.style.display = isOpen ? 'none' : 'block';
        arrow.innerText = isOpen ? '▼' : '▲';
    }

    function saveMemory() {
        localStorage.setItem('pink_writer_memory', document.getElementById('memory-input').value);
    }

    function changeModel() {
        selectedModel = document.getElementById('model-selector').value;
        localStorage.setItem('pink_writer_model', selectedModel);
    }

    function autoResizeInput(el) {
        const baseHeight = window.innerWidth <= 768 ? 42 : 56;
        el.style.height = baseHeight + 'px';
        el.style.height = Math.min(el.scrollHeight, 180) + 'px';
    }

    function getApiKey() {
        let key = localStorage.getItem('gemini_api_key_pink_v25');
        if (!key) {
            key = prompt("請輸入您的 Google Gemini API Key 以開啟專屬寫作靈感箱：");
            if (key) {
                key = key.trim();
                localStorage.setItem('gemini_api_key_pink_v25', key);
            }
        }
        return key;
    }

    function resetApiKey() {
        let oldKey = localStorage.getItem('gemini_api_key_pink_v25') || '';
        let newKey = prompt("修改你的 Gemini API Key 金鑰：", oldKey);
        if (newKey !== null) {
            localStorage.setItem('gemini_api_key_pink_v25', newKey.trim());
        }
    }

    function loadAppInitialization() {
        const savedModel = localStorage.getItem('pink_writer_model') || 'gemini-3.1-flash-lite';
        selectedModel = savedModel;
        document.getElementById('model-selector').value = selectedModel;
        document.getElementById('memory-input').value = localStorage.getItem('pink_writer_memory') || '';

        const savedRooms = localStorage.getItem('pink_chat_rooms_v4');
        if (savedRooms) {
            rooms = JSON.parse(savedRooms);
        } else {
            const defaultId = 'room-default';
            rooms[defaultId] = {
                name: "🌸 預設小說劇本線",
                messages: []
            };
        }
        
        currentRoomId = Object.keys(rooms)[0];
        renderSidebar();
        renderChatBox();
    }

    function saveRoomsToStorage() {
        localStorage.setItem('pink_chat_rooms_v4', JSON.stringify(rooms));
    }

    function renderSidebar() {
        const listContainer = document.getElementById('room-list');
        listContainer.innerHTML = '';

        Object.keys(rooms).forEach(id => {
            const roomItem = document.createElement('div');
            roomItem.className = `room-item ${id === currentRoomId ? 'active' : ''}`;
            roomItem.onclick = () => switchRoom(id);

            roomItem.innerHTML = `
                <span class="room-name">${rooms[id].name}</span>
                <div class="room-item-actions">
                    <button class="btn-room-action" onclick="renameRoom(event, '${id}')" title="重新命名">✎</button>
                    <button class="btn-room-action" onclick="deleteRoom(event, '${id}')" title="刪除">✕</button>
                </div>
            `;
            listContainer.appendChild(roomItem);
        });
    }

    function createNewRoom() {
        const roomName = prompt("請輸入新故事劇本的主題名稱：", "🎬 未命名故事線");
        if (!roomName) return;

        const newId = 'room-' + Date.now();
        rooms[newId] = { name: roomName, messages: [] };
        currentRoomId = newId;
        saveRoomsToStorage();
        renderSidebar();
        renderChatBox();
        closeMobileSidebar();
    }

    function renameRoom(event, id) {
        event.stopPropagation();
        const currentName = rooms[id].name;
        const newName = prompt(`為「${currentName}」更換新名字：`, currentName);
        if (newName && newName.trim() !== "") {
            rooms[id].name = newName.trim();
            saveRoomsToStorage();
            renderSidebar();
            if (id === currentRoomId) {
                document.getElementById('current-room-title').innerText = newName.trim();
            }
        }
    }

    function switchRoom(id) {
        if (isProcessing) return;
        currentRoomId = id;
        renderSidebar();
        renderChatBox();
        closeMobileSidebar();
    }

    function deleteRoom(event, id) {
        event.stopPropagation(); 
        if (Object.keys(rooms).length <= 1) {
            alert("保留最後一條故事線，才能留住靈魂喔！");
            return;
        }
        if (confirm(`確定要將「${rooms[id].name}」化為灰燼嗎？`)) {
            delete rooms[id];
            if (currentRoomId === id) {
                currentRoomId = Object.keys(rooms)[0];
            }
            saveRoomsToStorage();
            renderSidebar();
            renderChatBox();
        }
    }

    function renderChatBox() {
        const chatBox = document.getElementById('chat-box');
        const titleContainer = document.getElementById('current-room-title');
        chatBox.innerHTML = '';

        if (!currentRoomId || !rooms[currentRoomId]) {
            titleContainer.innerText = "請建立劇本線";
            return;
        }

        titleContainer.innerText = rooms[currentRoomId].name;
        const messages = rooms[currentRoomId].messages;

        if (messages.length === 0) {
            appendMessageNode({ versions: ["準備好了，你想讓我陪你撰寫什麼樣的虛構小說情節？"], activeIndex: 0 }, 'ai', -1);
        } else {
            messages.forEach((msg, idx) => {
                appendMessageNode(msg, msg.type, idx);
            });
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert("✨ 提示詞已複製到剪貼簿！");
        }).catch(err => {
            console.error('複製失敗: ', err);
        });
    }

    function appendMessageNode(msgData, type, index) {
        const chatBox = document.getElementById('chat-box');
        const container = document.createElement('div');
        container.className = `message-container ${type}`;
        container.id = `msg-container-${index}`;

        const msgDiv = document.createElement('div');
        
        let isError = false;
        let textToShow = "";
        let activeIdx = 0;
        let totalVersions = 1;

        if (typeof msgData === 'string') {
            textToShow = msgData;
            rooms[currentRoomId].messages[index] = { type: type, versions: [msgData], activeIndex: 0 };
        } else {
            activeIdx = msgData.activeIndex || 0;
            textToShow = msgData.versions[activeIdx] || "";
            totalVersions = msgData.versions.length;
            if (msgData.isError) isError = true;
        }

        msgDiv.className = `message ${type === 'user' ? 'user-message' : 'ai-message'} ${isError ? 'system-error-message' : ''}`;
        msgDiv.innerText = textToShow;
        container.appendChild(msgDiv);

        if (index >= 0) {
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'message-actions';
            
            if (type === 'user') {
                // 編輯提示按鈕
                const editBtn = document.createElement('button');
                editBtn.className = 'action-btn';
                editBtn.innerHTML = '✎ 更改提示';
                editBtn.onclick = () => enableEditMode(container, index, textToShow, 'user');
                actionsDiv.appendChild(editBtn);

                // 新增：複製提示按鈕 (加大)
                const copyBtn = document.createElement('button');
                copyBtn.className = 'action-btn';
                copyBtn.innerHTML = '📋 複製提示';
                copyBtn.onclick = () => copyToClipboard(textToShow);
                actionsDiv.appendChild(copyBtn);

            } else if (type === 'ai') {
                // 編輯 AI 回應按鈕 (加大)
                const editAiBtn = document.createElement('button');
                editAiBtn.className = 'action-btn';
                editAiBtn.innerHTML = '✍️ 編輯回應';
                editAiBtn.onclick = () => enableEditMode(container, index, textToShow, 'ai');
                actionsDiv.appendChild(editAiBtn);

                // 重試刷新按鈕 (即便系統錯誤，此按鈕也會顯示，且不漏掉任何一個)
                const refreshBtn = document.createElement('button');
                refreshBtn.className = 'action-btn';
                refreshBtn.innerHTML = '↻ 重試或刷新';
                refreshBtn.onclick = () => requestNewBranch(index);
                actionsDiv.appendChild(refreshBtn);
            }

            // 分支版本切換 (我方舊提示與 AI 回應皆可隨之切換回去)
            if (totalVersions > 1) {
                const switcher = document.createElement('div');
                switcher.className = 'version-switcher';
                
                const leftBtn = document.createElement('button');
                leftBtn.className = 'version-arrow';
                leftBtn.innerText = '◀';
                leftBtn.disabled = activeIdx === 0;
                leftBtn.onclick = () => switchVersion(index, -1);

                const infoSpan = document.createElement('span');
                infoSpan.innerText = `${activeIdx + 1} / ${totalVersions}`;

                const rightBtn = document.createElement('button');
                rightBtn.className = 'version-arrow';
                rightBtn.innerText = '▶';
                rightBtn.disabled = activeIdx === totalVersions - 1;
                rightBtn.onclick = () => switchVersion(index, 1);

                switcher.appendChild(leftBtn);
                switcher.appendChild(infoSpan);
                switcher.appendChild(rightBtn);
                actionsDiv.appendChild(switcher);
            }
            container.appendChild(actionsDiv);
        }
        chatBox.appendChild(container);
    }

    // 支援切換版本：切換我方版本時，對話歷史也會切回該分支，達到「保留我方舊提示詞之AI回應，切換回去時可以察看、延續」
    function switchVersion(msgIndex, direction) {
        const msgData = rooms[currentRoomId].messages[msgIndex];
        let newIdx = msgData.activeIndex + direction;
        if (newIdx >= 0 && newIdx < msgData.versions.length) {
            msgData.activeIndex = newIdx;
            saveRoomsToStorage();
            renderChatBox();
        }
    }

    function enableEditMode(container, index, currentText, type) {
        if (isProcessing) return;
        container.innerHTML = `
            <textarea class="edit-textarea" id="edit-box-${index}">${currentText}</textarea>
            <div class="edit-controls">
                <button class="btn-edit-cancel" onclick="renderChatBox()">取消</button>
                <button class="btn-edit-save" onclick="saveEdit(${index}, '${type}')">儲存變更</button>
            </div>
        `;
    }

    async function saveEdit(index, type) {
        const newText = document.getElementById(`edit-box-${index}`).value.trim();
        if (!newText) {
            renderChatBox();
            return;
        }

        const msgObj = rooms[currentRoomId].messages[index];

        if (type === 'user') {
            // 如果是編輯使用者的提示詞，保留舊的提示詞，新增一個版本，並切換到新版本
            msgObj.versions.push(newText);
            msgObj.activeIndex = msgObj.versions.length - 1;
            
            // 重要：我們保留該使用者版本之後的所有「分支」。為了在重新生成 AI 回應時，不刪除其他分支，
            // 我們僅清除「目前索引之後」的對話 (或者在切換時重建歷史)，這裡我們清除此對話後面的內容並請求新回應，但舊提示對應的版本仍完整保留在版本的 versions 陣列中。
            rooms[currentRoomId].messages.splice(index + 1);
            saveRoomsToStorage();
            renderChatBox();
            await fetchAIResponse();
        } else {
            // 如果是編輯 AI 的回應，直接在此 AI 回應節點下新增一版修改後的文本，不破壞舊回應
            msgObj.versions.push(newText);
            msgObj.activeIndex = msgObj.versions.length - 1;
            msgObj.isError = false; // 移除報錯標記
            saveRoomsToStorage();
            renderChatBox();
        }
    }

    async function requestNewBranch(aiMsgIndex) {
        if (isProcessing) return;
        // 如果是點擊 AI 訊息的刷新重試，我們保留當前使用者的提示，清除此 AI 回應之後的對話，並在該 AI 節點上新增或刷新版本
        rooms[currentRoomId].messages.splice(aiMsgIndex + 1);
        saveRoomsToStorage();
        await fetchAIResponse(aiMsgIndex);
    }

    async function sendMessage() {
        if (isProcessing) return;
        const inputEl = document.getElementById('chat-input');
        const text = inputEl.value.trim();
        if (!text || !currentRoomId) return;

        const apiKey = getApiKey();
        if (!apiKey) return;

        inputEl.value = '';
        autoResizeInput(inputEl);

        rooms[currentRoomId].messages.push({
            type: 'user',
            versions: [text],
            activeIndex: 0
        });
        
        saveRoomsToStorage();
        renderChatBox();
        await fetchAIResponse();
    }

    document.getElementById('chat-input').addEventListener('focus', () => {
        setTimeout(() => {
            const chatBox = document.getElementById('chat-box');
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 300);
    });

    // 建立符合當前選取版本的分支歷史
    function buildApiContents(targetAiIndex = -1) {
        const list = rooms[currentRoomId].messages;
        let apiContents = [];
        let limit = targetAiIndex === -1 ? list.length : targetAiIndex;

        for (let i = 0; i < limit; i++) {
            const m = list[i];
            if (m.isError) continue; 
            if (m.type === 'user') {
                const activeText = m.versions ? m.versions[m.activeIndex || 0] : m.text;
                apiContents.push({ role: 'user', parts: [{ text: activeText }] });
            } else if (m.type === 'ai') {
                const activeText = m.versions[m.activeIndex || 0];
                apiContents.push({ role: 'model', parts: [{ text: activeText }] });
            }
        }
        return apiContents;
    }

    async function fetchAIResponse(isRefreshingIndex = -1) {
        const apiKey = getApiKey();
        if (!apiKey) return;

        isProcessing = true;
        const chatBox = document.getElementById('chat-box');
        let loadingMsg;

        if (isRefreshingIndex !== -1) {
            renderChatBox();
            const containerToReplace = document.getElementById(`msg-container-${isRefreshingIndex}`);
            if (containerToReplace) {
                loadingMsg = containerToReplace.querySelector('.message');
                loadingMsg.className = 'message ai-message loading-pulse';
                loadingMsg.innerText = '正在重新推敲新章節...🌸';
            }
        } else {
            const loadingContainer = document.createElement('div');
            loadingContainer.className = 'message-container ai';
            loadingMsg = document.createElement('div');
            loadingMsg.className = 'message ai-message loading-pulse';
            loadingMsg.innerText = '正在為你斟酌新靈感...🌸';
            loadingContainer.appendChild(loadingMsg);
            chatBox.appendChild(loadingContainer);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        let apiHistory = buildApiContents(isRefreshingIndex);

        try {
            // 配置阻擋情色審查與安全過濾的 BLOCK_NONE 等級
            const requestBody = {
                contents: apiHistory,
                systemInstruction: { parts: [{ text: getCombinedSystemInstruction() }] },
                safetySettings: [
                    { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                ]
            };

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            if (data.error) {
                throw new Error(`[API 報錯碼 ${data.error.code}]: ${data.error.message}`);
            }

            const candidate = data.candidates?.[0];
            if (!candidate) {
                throw new Error("Google 未回傳任何可能的回應（candidates 欄位不存在）。可能是連線頻率遭鎖。");
            }

            const finishReason = candidate.finishReason;
            if (finishReason && finishReason !== "STOP") {
                if (finishReason === "SAFETY") {
                    throw new Error("⚠️ 回應被安全過濾器攔截。已自動將 API 請求放寬至 BLOCK_NONE，若持續出現，請將當前對話中的敏感字眼稍作修飾再重試。");
                } else if (finishReason === "RECITATION") {
                    throw new Error("⚠️ 觸發了重複性抄襲保護機制。");
                } else {
                    throw new Error(`⚠️ Google 拒絕回答。原因代碼: ${finishReason}`);
                }
            }

            const aiText = candidate.content?.parts?.[0]?.text;
            if (!aiText) {
                throw new Error("⚠️ 回應成功但內容為空。");
            }

            if (isRefreshingIndex === -1) {
                rooms[currentRoomId].messages.push({
                    type: 'ai',
                    versions: [aiText],
                    activeIndex: 0
                });
            } else {
                const existingAiMsg = rooms[currentRoomId].messages[isRefreshingIndex];
                existingAiMsg.versions.push(aiText);
                existingAiMsg.activeIndex = existingAiMsg.versions.length - 1;
                existingAiMsg.isError = false; 
            }
            
            saveRoomsToStorage();
        } catch (error) {
            console.error(error);
            const errorText = error.message || "未知連線異常";
            
            if (isRefreshingIndex === -1) {
                rooms[currentRoomId].messages.push({
                    type: 'ai',
                    versions: [errorText],
                    activeIndex: 0,
                    isError: true
                });
            } else {
                const existingAiMsg = rooms[currentRoomId].messages[isRefreshingIndex];
                existingAiMsg.versions.push(errorText);
                existingAiMsg.activeIndex = existingAiMsg.versions.length - 1;
                existingAiMsg.isError = true;
            }
            saveRoomsToStorage();
        } finally {
            isProcessing = false;
            renderChatBox();
        }
    }

    function exportCurrentChat() {
        if (!currentRoomId || !rooms[currentRoomId]) return;
        const room = rooms[currentRoomId];
        const memoryText = localStorage.getItem('pink_writer_memory') || '（當前無全域設定）';
        let fileContent = `=========================================\n🌸 故事劇本線：${room.name}\n🧠 記憶設定備忘：\n${memoryText.trim()}\n=========================================\n\n`;

        room.messages.forEach(msg => {
            if (msg.isError) return;
            const idx = msg.activeIndex || 0;
            if (msg.type === 'user') {
                const text = msg.versions ? msg.versions[idx] : msg.text;
                fileContent += `【作者提示】\n${text}\n\n`;
            } else if (msg.type === 'ai') {
                fileContent += `【AI 創作】\n${msg.versions[idx]}\n\n-----------------------------------------\n\n`;
            }
        });

        const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `${room.name.replace(/[\\/:*?"<>|]/g, "")}_文字備份.txt`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function downloadAllDataBackup() {
        const dataPackage = {
            rooms: localStorage.getItem('pink_chat_rooms_v4') || '[]',
            memory: localStorage.getItem('pink_writer_memory') || ''
        };
        const blob = new Blob([JSON.stringify(dataPackage, null, 2)], { type: 'application/json;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `pink_story_backup.json`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function triggerRestoreFileInput() {
        document.getElementById('restore-file-input').click();
    }

    function handleRestoreFile(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const parsedData = JSON.parse(e.target.result);
                if (parsedData.rooms) {
                    if (confirm("這會完全覆蓋當前所有房間的進度，確定匯入嗎？")) {
                        localStorage.setItem('pink_chat_rooms_v4', parsedData.rooms);
                        localStorage.setItem('pink_writer_memory', parsedData.memory || '');
                        alert("還原成功！");
                        window.location.reload();
                    }
                } else {
                    alert("格式不符，請上傳正確的 .json 備份檔案。");
                }
            } catch (err) { alert("檔案讀取失敗。"); }
            input.value = '';
        };
        reader.readAsText(file);
    }

    window.addEventListener('DOMContentLoaded', loadAppInitialization);
</script>

</body>
</html>
