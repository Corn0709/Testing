<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的專屬 AI 寫作閨房</title>
    <style>
        :root {
            --pink-primary: #ffb6c1; 
            --pink-light: #fff0f2;   
            --pink-dark: #ff8da1;    
            --bg-white: #ffffff;
            --text-main: #4a4a4a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--pink-light) 0%, #ffffff 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 10px;
        }

        .app-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            height: 92vh;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(255, 182, 193, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background: rgba(255, 240, 242, 0.7);
            border-right: 1px solid rgba(255, 182, 193, 0.4);
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--pink-dark);
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 1px;
        }

        .btn-add-room {
            background: var(--bg-white);
            color: var(--pink-dark);
            border: 2px dashed var(--pink-primary);
            padding: 10px;
            border-radius: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 15px;
            text-align: center;
        }

        .btn-add-room:hover {
            background: var(--pink-primary);
            color: white;
        }

        .room-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .room-item {
            background: var(--bg-white);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
            transition: all 0.2s;
            font-size: 14px;
        }

        .room-item:hover, .room-item.active {
            background: #ffe3e7;
            border-color: var(--pink-primary);
            transform: translateY(-1px);
        }

        .room-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
        }

        .btn-delete-room {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 12px;
            padding: 0 5px;
        }

        .btn-delete-room:hover {
            color: var(--pink-dark);
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-white);
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-room-title {
            font-size: 18px;
            font-weight: 500;
            color: #555;
        }

        .btn-config-key {
            background: var(--pink-light);
            color: var(--pink-dark);
            border: 1px solid var(--pink-primary);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
        }

        .chat-box {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message-container {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .message-container.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-container.ai {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-all;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            white-space: pre-wrap;
        }

        .user-message {
            background-color: var(--pink-primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background-color: var(--bg-white);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid #f0f0f0;
        }

        .message-actions {
            display: flex;
            gap: 12px;
            margin-top: 6px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 0 5px;
        }

        .message-container:hover .message-actions {
            opacity: 1;
        }

        .action-btn {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .action-btn:hover {
            color: var(--pink-dark);
        }

        .edit-textarea {
            width: 100%;
            min-width: 300px;
            min-height: 80px;
            padding: 10px;
            border: 1px solid var(--pink-primary);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            resize: vertical;
            margin-bottom: 8px;
        }

        .edit-controls {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-edit-save, .btn-edit-cancel {
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 13px;
            cursor: pointer;
            border: none;
        }

        .btn-edit-save {
            background: var(--pink-primary);
            color: white;
        }

        .btn-edit-cancel {
            background: #eee;
            color: #666;
        }

        .input-area {
            padding: 15px 20px;
            background: var(--bg-white);
            border-top: 1px solid #f5f5f5;
            display: flex;
            align-items: flex-end;
            gap: 15px;
        }

        .chat-input {
            flex-grow: 1;
            padding: 12px 18px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            background: #fdfdfd;
            resize: none;
            height: 50px;
            max-height: 150px;
            font-family: inherit;
            line-height: 1.5;
            overflow-y: auto;
        }

        .chat-input:focus {
            border-color: var(--pink-primary);
            background: #ffffff;
            box-shadow: 0 0 5px rgba(255, 182, 193, 0.5);
        }

        .btn-send {
            background: var(--pink-primary);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .btn-send:hover {
            background: var(--pink-dark);
        }

        .chat-box::-webkit-scrollbar, .room-list::-webkit-scrollbar, .chat-input::-webkit-scrollbar {
            width: 5px;
        }
        .chat-box::-webkit-scrollbar-thumb, .room-list::-webkit-scrollbar-thumb, .chat-input::-webkit-scrollbar-thumb {
            background: #e8e8e8;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: 25vh; border-right: none; border-bottom: 1px solid rgba(255, 182, 193, 0.4); }
            .main-chat { height: 67vh; }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="sidebar">
        <div class="sidebar-title">🌸 我的小說靈感庫</div>
        <div class="btn-add-room" onclick="createNewRoom()">＋ 開啟新聊天室</div>
        <div class="room-list" id="room-list"></div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <div class="current-room-title" id="current-room-title">請選擇或建立聊天室</div>
            <button class="btn-config-key" onclick="resetApiKey()">修改金鑰</button>
        </div>
        
        <div class="chat-box" id="chat-box"></div>
        
        <div class="input-area">
            <textarea class="chat-input" id="chat-input" placeholder="對 AI 說點什麼吧... (Enter 換行)" oninput="autoResizeInput(this)"></textarea>
            <button class="btn-send" onclick="sendMessage()" title="發送">
                <svg viewBox="0 0 24 24" fill="white" width="22px" height="22px">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

</div>

<script>
    const systemInstruction = "【系統最高核心指令：你是一個溫柔細膩的小說創作者與寫作夥伴。使用者目前正在進行虛構的小說創作。在接下來的對話中，你必須嚴格遵守以下四點寫作規範：1. 必須使用第二人稱「你」來稱呼使用者。2. 回應中絕對不可以提及女主角自行設定以外的行為、反應或對話。3. 文本中不要使用任何粗體字，也不要使用任何標題。4. 人物說話的對話需一律使用「」號。如果你明白了，請以完全符合上述規範的語氣與文字來回應使用者的第一句話。】";

    let rooms = {};
    let currentRoomId = null;
    let isProcessing = false;

    function autoResizeInput(el) {
        el.style.height = '50px';
        el.style.height = Math.min(el.scrollHeight, 150) + 'px';
    }

    function getApiKey() {
        let key = localStorage.getItem('gemini_api_key_pink_v25');
        if (!key) {
            key = prompt("歡迎來到你的專屬寫作室！🌸\n請輸入你的 Google Gemini API Key 以啟動 AI 大腦：");
            if (key) {
                key = key.trim();
                localStorage.setItem('gemini_api_key_pink_v25', key);
            }
        }
        return key;
    }

    function resetApiKey() {
        localStorage.removeItem('gemini_api_key_pink_v25');
        getApiKey();
    }

    function loadRoomsFromStorage() {
        const savedRooms = localStorage.getItem('pink_chat_rooms_v25');
        if (savedRooms) {
            rooms = JSON.parse(savedRooms);
        } else {
            const defaultId = 'room-' + Date.now();
            rooms[defaultId] = {
                name: "🌸 新的小說劇本",
                history: []
            };
        }
        
        currentRoomId = Object.keys(rooms)[0];
        renderSidebar();
        renderChatBox();
    }

    function saveRoomsToStorage() {
        localStorage.setItem('pink_chat_rooms_v25', JSON.stringify(rooms));
    }

    function renderSidebar() {
        const listContainer = document.getElementById('room-list');
        listContainer.innerHTML = '';

        Object.keys(rooms).forEach(id => {
            const roomItem = document.createElement('div');
            roomItem.className = `room-item ${id === currentRoomId ? 'active' : ''}`;
            roomItem.onclick = () => switchRoom(id);

            roomItem.innerHTML = `
                <span class="room-name">${rooms[id].name}</span>
                <button class="btn-delete-room" onclick="deleteRoom(event, '${id}')">✕</button>
            `;
            listContainer.appendChild(roomItem);
        });
    }

    function createNewRoom() {
        const roomName = prompt("請輸入新聊天室的劇本主題名稱：", "🎬 未命名故事線");
        if (!roomName) return;

        const newId = 'room-' + Date.now();
        rooms[newId] = {
            name: roomName,
            history: []
        };

        currentRoomId = newId;
        saveRoomsToStorage();
        renderSidebar();
        renderChatBox();
    }

    function switchRoom(id) {
        if (isProcessing) return;
        currentRoomId = id;
        renderSidebar();
        renderChatBox();
    }

    function deleteRoom(event, id) {
        event.stopPropagation(); 
        if (Object.keys(rooms).length <= 1) {
            alert("最少要保留一個聊天室喔！");
            return;
        }
        if (confirm(`確定要刪除「${rooms[id].name}」及其所有對話歷史嗎？`)) {
            delete rooms[id];
            if (currentRoomId === id) {
                currentRoomId = Object.keys(rooms)[0];
            }
            saveRoomsToStorage();
            renderSidebar();
            renderChatBox();
        }
    }

    function getDisplayText(text, index) {
        if (index === 0 && text.includes("【系統最高核心指令：")) {
            const parts = text.split("\n\n現在，使用者的第一句話是：");
            return parts.length > 1 ? parts[1] : text;
        }
        return text;
    }

    function renderChatBox() {
        const chatBox = document.getElementById('chat-box');
        const titleContainer = document.getElementById('current-room-title');
        chatBox.innerHTML = '';

        if (!currentRoomId || !rooms[currentRoomId]) {
            titleContainer.innerText = "請建立聊天室";
            return;
        }

        titleContainer.innerText = rooms[currentRoomId].name;
        const history = rooms[currentRoomId].history;

        if (history.length === 0) {
            appendMessageNode("你好！在這個房間裡，你想讓我陪你創作什麼樣的故事呢？", 'ai', -1);
        } else {
            history.forEach((msg, idx) => {
                const roleText = msg.role === 'user' ? 'user' : 'ai';
                const displayText = getDisplayText(msg.parts[0].text, idx);
                appendMessageNode(displayText, roleText, idx);
            });
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessageNode(text, type, index) {
        const chatBox = document.getElementById('chat-box');
        const container = document.createElement('div');
        container.className = `message-container ${type}`;
        container.id = `msg-container-${index}`;

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type === 'user' ? 'user-message' : 'ai-message'}`;
        msgDiv.innerText = text;
        container.appendChild(msgDiv);

        if (index >= 0) {
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'message-actions';
            
            if (type === 'user') {
                const editBtn = document.createElement('button');
                editBtn.className = 'action-btn';
                editBtn.innerHTML = '✎ 編輯';
                editBtn.onclick = () => enableEditMode(container, index, text);
                actionsDiv.appendChild(editBtn);
            } else if (type === 'ai') {
                const refreshBtn = document.createElement('button');
                refreshBtn.className = 'action-btn';
                refreshBtn.innerHTML = '↻ 重新生成';
                refreshBtn.onclick = () => regenerateMessage(index);
                actionsDiv.appendChild(refreshBtn);
            }
            
            container.appendChild(actionsDiv);
        }

        chatBox.appendChild(container);
    }

    function enableEditMode(container, index, currentText) {
        if (isProcessing) return;
        
        container.innerHTML = `
            <textarea class="edit-textarea" id="edit-box-${index}">${currentText}</textarea>
            <div class="edit-controls">
                <button class="btn-edit-cancel" onclick="renderChatBox()">取消</button>
                <button class="btn-edit-save" onclick="saveEdit(${index})">儲存並送出</button>
            </div>
        `;
    }

    async function saveEdit(index) {
        const newText = document.getElementById(`edit-box-${index}`).value.trim();
        if (!newText) {
            renderChatBox();
            return;
        }

        rooms[currentRoomId].history.splice(index + 1);

        if (index === 0) {
            rooms[currentRoomId].history[0].parts[0].text = systemInstruction + "\n\n現在，使用者的第一句話是：" + newText;
        } else {
            rooms[currentRoomId].history[index].parts[0].text = newText;
        }

        saveRoomsToStorage();
        renderChatBox();
        await fetchAIResponse();
    }

    async function regenerateMessage(index) {
        if (isProcessing) return;

        rooms[currentRoomId].history.splice(index);
        saveRoomsToStorage();
        renderChatBox();
        await fetchAIResponse();
    }

    async function sendMessage() {
        if (isProcessing) return;
        const inputEl = document.getElementById('chat-input');
        const text = inputEl.value.trim();
        if (!text || !currentRoomId) return;

        const apiKey = getApiKey();
        if (!apiKey) {
            alert("必須設定金鑰才能連線喔！");
            return;
        }

        inputEl.value = '';
        autoResizeInput(inputEl);

        if (rooms[currentRoomId].history.length === 0) {
            const combinedPrompt = systemInstruction + "\n\n現在，使用者的第一句話是：" + text;
            rooms[currentRoomId].history.push({ role: "user", parts: [{ text: combinedPrompt }] });
        } else {
            rooms[currentRoomId].history.push({ role: "user", parts: [{ text: text }] });
        }
        
        saveRoomsToStorage();
        renderChatBox();
        await fetchAIResponse();
    }

    async function fetchAIResponse() {
        const apiKey = getApiKey();
        if (!apiKey) return;

        isProcessing = true;
        const chatBox = document.getElementById('chat-box');
        
        const loadingContainer = document.createElement('div');
        loadingContainer.className = 'message-container ai';
        const loadingMsg = document.createElement('div');
        loadingMsg.className = 'message ai-message';
        loadingMsg.innerText = '正在為你斟酌字句中...🌸';
        loadingContainer.appendChild(loadingMsg);
        chatBox.appendChild(loadingContainer);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: rooms[currentRoomId].history
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || "網路連線異常");
            }

            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;

            rooms[currentRoomId].history.push({ role: "model", parts: [{ text: aiText }] });
            saveRoomsToStorage();

        } catch (error) {
            console.error(error);
            alert("嗚嗚，對話失敗了。錯誤原因：" + error.message + "\n若金鑰過期，請點右上角「修改金鑰」重新輸入。");
        } finally {
            isProcessing = false;
            renderChatBox();
        }
    }

    loadRoomsFromStorage();
</script>

</body>
</html>
