<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的專屬 AI 寫作閨房</title>
    <style>
        :root {
            --pink-primary: #ffb6c1; 
            --pink-light: #fff0f2;   
            --pink-dark: #ff8da1;    
            --bg-white: #ffffff;
            --text-main: #4a4a4a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--pink-light) 0%, #ffffff 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 10px;
        }

        .app-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            height: 92vh;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(255, 182, 193, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            overflow: hidden;
            animation: appSpawn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes appSpawn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .sidebar {
            width: 260px;
            background: rgba(255, 240, 242, 0.7);
            border-right: 1px solid rgba(255, 182, 193, 0.4);
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--pink-dark);
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 1px;
        }

        .btn-add-room {
            background: var(--bg-white);
            color: var(--pink-dark);
            border: 2px dashed var(--pink-primary);
            padding: 10px;
            border-radius: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
            text-align: center;
        }

        .btn-add-room:hover {
            background: var(--pink-primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 182, 193, 0.4);
        }

        .room-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .room-item {
            background: var(--bg-white);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-size: 14px;
        }

        .room-item:hover {
            background: #ffe3e7;
            border-color: var(--pink-primary);
            transform: translateX(4px);
        }

        .room-item.active {
            background: #ffe3e7;
            border-color: var(--pink-primary);
            font-weight: 500;
            transform: translateX(6px);
            box-shadow: -4px 0 0 var(--pink-dark);
        }

        .room-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
        }

        .btn-delete-room {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 12px;
            padding: 0 5px;
            transition: color 0.2s;
        }

        .btn-delete-room:hover {
            color: var(--pink-dark);
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-white);
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-room-title {
            font-size: 18px;
            font-weight: 500;
            color: #555;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .model-select {
            padding: 6px 10px;
            border-radius: 15px;
            border: 1px solid var(--pink-primary);
            background-color: var(--bg-white);
            color: var(--pink-dark);
            font-size: 12px;
            outline: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .model-select:hover {
            background-color: var(--pink-light);
        }

        .quota-panel {
            display: flex;
            gap: 10px;
            font-size: 12px;
            background: var(--pink-light);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 182, 193, 0.3);
            color: #7a6065;
        }

        .quota-val {
            color: var(--pink-dark);
            font-weight: 600;
        }

        .btn-config-key {
            background: var(--bg-white);
            color: var(--pink-dark);
            border: 1px solid var(--pink-primary);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-config-key:hover {
            background: var(--pink-light);
            transform: translateY(-1px);
        }

        .chat-box {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message-container {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: msgSpawn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes msgSpawn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-container.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-container.ai {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-all;
            box-shadow: 0 3px 8px rgba(0,0,0,0.03);
            white-space: pre-wrap;
            transition: box-shadow 0.2s;
        }

        .user-message {
            background-color: var(--pink-primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background-color: var(--bg-white);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid #f0f0f0;
        }

        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            padding: 0 4px;
        }

        .action-btn {
            background-color: var(--pink-primary);
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 3px;
            box-shadow: 0 2px 5px rgba(255, 182, 193, 0.4);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .action-btn:hover {
            background-color: var(--pink-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 141, 161, 0.5);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .loading-pulse {
            background: linear-gradient(90deg, #ffffff 0%, #fff0f2 50%, #ffffff 100%);
            background-size: 200% 100%;
            animation: pulseBg 1.5s infinite linear;
            border: 1px solid var(--pink-primary);
        }

        @keyframes pulseBg {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .edit-textarea {
            width: 100%;
            min-width: 300px;
            min-height: 80px;
            padding: 10px;
            border: 1px solid var(--pink-primary);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            resize: vertical;
            margin-bottom: 8px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .edit-controls {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-edit-save, .btn-edit-cancel {
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 13px;
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
        }

        .btn-edit-save {
            background: var(--pink-primary);
            color: white;
        }

        .btn-edit-save:hover { background: var(--pink-dark); transform: translateY(-1px); }

        .btn-edit-cancel {
            background: #eee;
            color: #666;
        }
        
        .btn-edit-cancel:hover { transform: translateY(-1px); }

        .input-area {
            padding: 15px 20px;
            background: var(--bg-white);
            border-top: 1px solid #f5f5f5;
            display: flex;
            align-items: flex-end;
            gap: 15px;
        }

        .chat-input {
            flex-grow: 1;
            padding: 12px 18px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            background: #fdfdfd;
            resize: none;
            height: 50px;
            max-height: 150px;
            font-family: inherit;
            line-height: 1.5;
            overflow-y: auto;
        }

        .chat-input:focus {
            border-color: var(--pink-primary);
            background: #ffffff;
            box-shadow: 0 0 5px rgba(255, 182, 193, 0.5);
        }

        .btn-send {
            background: var(--pink-primary);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
