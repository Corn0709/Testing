<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Direct</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* iPhone 外框 */
    .iphone {
      width: 393px;
      height: 852px;
      background-color: #fff0f3;
      border-radius: 55px;
      box-shadow: 0 0 0 12px #2d2d2d, 0 0 0 13px #1a1a1a, 0 25px 60px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 動態島 */
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 35px;
      background-color: #000;
      border-radius: 20px;
      z-index: 300;
    }

    /* iOS 頂部狀態列 */
    .status-bar {
      height: 54px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 28px 10px 28px;
      color: #ff4d6d;
      font-size: 14px;
      font-weight: 600;
      z-index: 200;
      background-color: #fff0f3;
    }

    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 12px;
    }

    /* IG 聊天頂部 Header */
    .chat-header {
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid #ffccd5;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 24px;
      color: #ff4d6d;
      cursor: pointer;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      border: 1.5px solid #ff758f;
    }

    .user-info .username {
      font-size: 15px;
      font-weight: 600;
      color: #590d22;
    }

    .user-info .status {
      font-size: 11px;
      color: #ff758f;
    }

    .header-actions {
      display: flex;
      gap: 16px;
      color: #ff4d6d;
    }

    .header-actions svg {
      width: 22px;
      height: 22px;
      fill: #ff4d6d;
      cursor: pointer;
    }

    /* 訊息對話區域 */
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(180deg, #fff0f3 0%, #ffccd5 100%);
    }

    .time-divider {
      text-align: center;
      font-size: 11px;
      color: #a37081;
      margin: 8px 0;
    }

    .message {
      display: flex;
      max-width: 75%;
      flex-direction: column;
    }

    .message.received {
      align-self: flex-start;
    }

    .message.sent {
      align-self: flex-end;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }

    .received .msg-bubble {
      background-color: #ffffff;
      color: #590d22;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 6px rgba(255, 182, 193, 0.3);
    }

    .sent .msg-bubble {
      background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 8px rgba(255, 77, 109, 0.3);
    }

    /* 底部輸入欄 */
    .input-bar {
      padding: 10px 16px 28px 16px;
      background: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #ffccd5;
    }

    .input-box {
      flex: 1;
      height: 40px;
      background: #fff0f3;
      border-radius: 20px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      border: 1px solid #ffb3c1;
    }

    .input-box input {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      color: #590d22;
    }

    .input-box input::placeholder {
      color: #c9184a;
      opacity: 0.5;
    }

    .send-btn {
      background: none;
      border: none;
      color: #ff4d6d;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 底部 Home Bar */
    .home-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 5px;
      background-color: #ff758f;
      border-radius: 10px;
      z-index: 400;
    }
  </style>
</head>
<body>

  <div class="iphone">
    <!-- 動態島 -->
    <div class="dynamic-island"></div>

    <!-- 狀態列 -->
    <div class="status-bar">
      <span>09:41</span>
      <div class="status-icons">
        <span>5G</span>
        <span>100%</span>
      </div>
    </div>

    <!-- 頂部 Header -->
    <div class="chat-header">
      <div class="header-left">
        <button class="back-btn">‹</button>
        <div class="header-user">
          <div class="avatar" style="background-image: url('https://picsum.photos/100/100');"></div>
          <div class="user-info">
            <div class="username">我的專屬AI</div>
            <div class="status">目前線上</div>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <svg viewBox="0 0 24 24"><path d="M15.5 12c0 1.93-1.57 3.5-3.5 3.5S8.5 13.93 8.5 12s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5zm-3.5-6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z"/></svg>
      </div>
    </div>

    <!-- 對話內容區 -->
    <div class="chat-body" id="chatBody">
      <div class="time-divider">今天 上午 09:41</div>
      
      <div class="message received">
        <div class="msg-bubble">歡迎來到你的專屬 AI 房間！今天想跟我聊聊什麼呢？</div>
      </div>
    </div>

    <!-- 輸入欄 -->
    <div class="input-bar">
      <div class="input-box">
        <input type="text" id="messageInput" placeholder="發送訊息..." onkeypress="handleKeyPress(event)">
      </div>
      <button class="send-btn" onclick="sendMessage()">發送</button>
    </div>

    <!-- 底部 Home Bar -->
    <div class="home-bar"></div>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      
      if (text !== '') {
        const chatBody = document.getElementById('chatBody');
        
        // 建立訊息氣泡
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message sent';
        
        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        bubble.innerText = text;
        
        msgDiv.appendChild(bubble);
        chatBody.appendChild(msgDiv);
        
        // 清空輸入框並置底
        input.value = '';
        chatBody.scrollTop = chatBody.scrollHeight;
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    }
  </script>
</body>
</html>
